# ================================================
# Instance ke-2? Lihat docker-compose.instance2.yml
# Cara: docker compose -f docker-compose.instance2.yml --env-file .env.instance2 up -d
# ================================================

services:
  db:
    image: mysql:8.0
    container_name: hadirq-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hadirq123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-absensi}
      MYSQL_USER: ${MYSQL_USER:-hadirq}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hadirq123}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - hadirq-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ghcr.io/${GITHUB_REPO_OWNER:-b4n9juky}/absensi-hadirq-backend:latest
    container_name: hadirq-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL:?error}
      - CORS_ORIGIN=${CORS_ORIGIN:?error}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?error}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:?error}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Jakarta}
      - SCHOOL_LATITUDE=${SCHOOL_LATITUDE:-0.144011}
      - SCHOOL_LONGITUDE=${SCHOOL_LONGITUDE:-117.473191}
      - SCHOOL_RADIUS_METERS=${SCHOOL_RADIUS_METERS:-50}
      - MAX_ACCURACY_METERS=${MAX_ACCURACY_METERS:-30}
      - KIOSK_SECRET_KEY=${KIOSK_SECRET_KEY:-absensi123456}
      - WA_PROXY_URL=${WA_PROXY_URL:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@presensimipi.web.id}
    volumes:
      - uploads_data:/app/backend/uploads
      - baileys_auth_data:/app/backend/baileys_auth_info
    networks:
      - hadirq-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/api/config/debug"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: hadirq-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - hadirq-network

  certbot:
    image: certbot/certbot
    container_name: hadirq-certbot
    restart: unless-stopped
    volumes:
      - certs_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  db_data:
  uploads_data:
  baileys_auth_data:
  certs_data:
  certbot_www:

networks:
  hadirq-network:
    driver: bridge
